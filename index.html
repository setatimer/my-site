 tools. No outside users are given access. What is this?",kind:"single",pickLabel:"Choose one",options:["Internet","Intranet","Extranet","WAN"],correct:[1],explanation:"An intranet is a private network used within an organization."},{id:14,tag:"Scenario",prompt:"A supplier is given limited access to a company’s private network to check orders. What is this kind of access called?",kind:"single",pickLabel:"Choose one",options:["Intranet","Extranet","Internet","PAN"],correct:[1],explanation:"An extranet is a private network that gives selected outside users or organizations access."},{id:15,tag:"Term → Definition",prompt:"Which term means “the worldwide system of interconnected networks”?",kind:"single",pickLabel:"Choose one",options:["Intranet","LAN","Internet","VPN"],correct:[2],explanation:"The Internet is the worldwide system of interconnected networks."},{id:16,tag:"Term → Definition",prompt:"What is Bandwidth?",kind:"single",pickLabel:"Choose one",options:["The amount of data successfully transferred in a given time","The maximum data-carrying capacity of a connection","The time it takes data to travel from source to destination","Variation in packet delay or arrival time"],correct:[1],explanation:"Bandwidth is the maximum data-carrying capacity of a connection."},{id:17,tag:"Term → Definition",prompt:"What is Throughput?",kind:"single",pickLabel:"Choose one",options:["The maximum data-carrying capacity of a connection","Variation in packet delay or arrival time","The amount of data successfully transferred in a given time","A condition in which packets fail to reach their destination"],correct:[2],explanation:"Throughput is the amount of data successfully transferred in a given time."},{id:18,tag:"Term → Definition",prompt:"What is Latency?",kind:"single",pickLabel:"Choose one",options:["The time it takes data to travel from source to destination","The maximum data-carrying capacity of a connection","Variation in packet delay or arrival time","A protected connection across another network"],correct:[0],explanation:"Latency is the time it takes data to travel from source to destination."},{id:19,tag:"Term → Definition",prompt:"What is Jitter?",kind:"single",pickLabel:"Choose one",options:["Packets failing to reach their destination","The time it takes data to travel from source to destination","Variation in packet delay or arrival time","The amount of data successfully transferred in a given time"],correct:[2],explanation:"Jitter is variation in packet delay or arrival time."},{id:20,tag:"Term → Definition",prompt:"What is Packet Loss?",kind:"single",pickLabel:"Choose one",options:["Variation in packet delay or arrival time","A condition in which data packets fail to reach their destination","The maximum data-carrying capacity of a connection","A private network used within an organization"],correct:[1],explanation:"Packet Loss is a condition in which data packets fail to reach their destination."},{id:21,tag:"Multi-select · Pick 2",prompt:"Which TWO are examples of a Host?",kind:"multi",pickLabel:"Select ALL that apply — Pick 2",options:["A laptop sending an email","A printer receiving a print job","A length of cable with no device attached","An unused wall port with nothing connected"],correct:[0,1],explanation:"A host sends or receives network data, so the laptop and printer both qualify. A cable or empty port alone is not sending or receiving data."},{id:22,tag:"Multi-select · Pick 3",prompt:"Which THREE statements about Client and Server are true?",kind:"multi",pickLabel:"Select ALL that apply — Pick 3",options:["A client is a device or program that requests a service","A server provides services to other devices","A server requests services from its clients","A client provides services to other devices","A client is a device or program"],correct:[0,1,4],explanation:"A client requests a service, and a server provides services. The client is the requester, not the provider."},{id:23,tag:"Multi-select · Pick 2",prompt:"Which TWO describe a WAN?",kind:"multi",pickLabel:"Select ALL that apply — Pick 2",options:["Connects networks over large geographic distances","Connects networks, not just devices in one room","Connects devices only in a limited area such as a home","Uses wireless connections only"],correct:[0,1],explanation:"A WAN connects networks over large geographic distances."},{id:24,tag:"Multi-select · Pick 2",prompt:"Which TWO statements about LAN and WLAN are true?",kind:"multi",pickLabel:"Select ALL that apply — Pick 2",options:["A LAN connects devices in a limited area, such as a home or office","A WLAN is a LAN using wireless connections","A WLAN must use wired connections only","A LAN must be wireless"],correct:[0,1],explanation:"A LAN covers a limited area. A WLAN is that same kind of local network using wireless connections."},{id:25,tag:"Multi-select · Pick 2",prompt:"Which TWO statements about Intranet and Extranet are true?",kind:"multi",pickLabel:"Select ALL that apply — Pick 2",options:["An intranet is a private network used within an organization","An extranet gives selected outside users or organizations access","An extranet is open to everyone on the Internet","An intranet gives outside users access to the private network"],correct:[0,1],explanation:"An intranet stays within an organization. An extranet extends limited private-network access to selected outsiders."},{id:26,tag:"Multi-select · Pick 2",prompt:"Which TWO statements about Bandwidth and Throughput are true?",kind:"multi",pickLabel:"Select ALL that apply — Pick 2",options:["Bandwidth is the maximum data-carrying capacity of a connection","Throughput is the amount of data successfully transferred in a given time","Throughput is the maximum data-carrying capacity","Bandwidth is the amount of data successfully transferred"],correct:[0,1],explanation:"Bandwidth is the maximum capacity. Throughput is what is actually and successfully transferred in a given time."},{id:27,tag:"Multi-select · Pick 3",prompt:"Which THREE could be a Node?",kind:"multi",pickLabel:"Select ALL that apply — Pick 3",options:["A router on a network","A connection point where a cable plugs in","A printer on a network","A device that has never been connected to any network"],correct:[0,1,2],explanation:"A node is any device or connection point on a network, so the router, connection point, and printer all qualify."},{id:28,tag:"Multi-select · Pick 2",prompt:"Which TWO terms describe problems with how packets arrive?",kind:"multi",pickLabel:"Select ALL that apply — Pick 2",options:["Jitter","Packet Loss","Bandwidth","Throughput"],correct:[0,1],explanation:"Jitter is variation in packet delay or arrival time. Packet Loss is packets failing to reach their destination."},{id:29,tag:"Compare / Contrast",prompt:"Which network type covers the larger geographic scope: LAN or WAN?",kind:"single",pickLabel:"Choose one",options:["LAN","WAN","They cover exactly the same scope","PAN"],correct:[1],explanation:"A LAN is limited to a home or office area, while a WAN connects networks over large geographic distances."},{id:30,tag:"Compare / Contrast",prompt:"What is the main difference between an Intranet and an Extranet?",kind:"single",pickLabel:"Choose one",options:["An intranet is wireless and an extranet is wired","An intranet is for inside an organization; an extranet gives selected outsiders access","An extranet is worldwide and an intranet is citywide","There is no difference"],correct:[1],explanation:"An intranet is used within an organization. An extranet gives selected outside users or organizations access."},{id:31,tag:"Compare / Contrast",prompt:"A plan advertises 500 Mbps maximum capacity. A speed test shows 420 Mbps actually and successfully transferred. What does the 420 Mbps represent?",kind:"single",pickLabel:"Choose one",options:["Bandwidth","Latency","Throughput","Jitter"],correct:[2],explanation:"Throughput is the amount successfully transferred in a given time. The 500 Mbps maximum is bandwidth."},{id:32,tag:"Compare / Contrast",prompt:"Which statement best distinguishes a Host from a Node?",kind:"single",pickLabel:"Choose one",options:["A host is any connection point; a node must send data","A host sends or receives network data, while a node can be any device or connection point","A node is always a server; a host is always a client","They mean exactly the same thing"],correct:[1],explanation:"A host sends or receives network data. A node is broader: any device or connection point on a network."},{id:33,tag:"Which is NOT…",prompt:"Which is NOT a network type defined by size or scope?",kind:"single",pickLabel:"Choose one",options:["LAN","WAN","Network Interface Card (NIC)","MAN"],correct:[2],explanation:"LAN, WAN, and MAN are network types. A NIC is hardware that connects a device to a network."},{id:34,tag:"Which is NOT…",prompt:"Which is NOT true about a VPN?",kind:"single",pickLabel:"Choose one",options:["It creates a protected connection across another network","It can protect a connection across a public network","It makes a private network open to everyone","It creates a protected connection"],correct:[2],explanation:"A VPN creates a protected connection across another network — it does not make a private network open to everyone."},{id:35,tag:"Scenario",prompt:"During a video call, several words never arrive at all and sentences have gaps. Which term best describes this?",kind:"single",pickLabel:"Choose one",options:["Bandwidth","Packet Loss","Latency","WLAN"],correct:[1],explanation:"Packet Loss is a condition in which data packets fail to reach their destination."},{id:36,tag:"Scenario",prompt:"In an online game, a player clicks and the action happens noticeably later because the data takes a long time to travel. Which term best describes this delay?",kind:"single",pickLabel:"Choose one",options:["Jitter","Latency","Throughput","Packet Loss"],correct:[1],explanation:"Latency is the time it takes data to travel from source to destination."}
